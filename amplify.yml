version: 1
applications:
  - appRoot: client
    frontend:
      phases:
        preBuild:
          commands:
            - nvm use 22 || nvm install 22
            - npm ci
        build:
          commands:
            - npm run build
      artifacts:
        baseDirectory: dist
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
      customHeaders:
        - pattern: '{index.html,sw.js,registerSW.js,push-sw.js,manifest.webmanifest}'
          headers:
            - key: Cache-Control
              value: no-cache
        - pattern: 'assets/**'
          headers:
            - key: Cache-Control
              value: public, max-age=31536000, immutable
