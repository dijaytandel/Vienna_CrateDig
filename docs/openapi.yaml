openapi: 3.1.0
info:
  title: CrateDig API
  version: 1.0.0
  description: |
    REST API for CrateDig, a local vinyl discovery and collection tool.
    Every error response uses the `Error` schema.
  license:
    name: UNLICENSED
    identifier: UNLICENSED
servers:
  - url: http://localhost:3000/api/v1
    description: Local development
tags:
  - name: system
    description: Service status
  - name: catalog
    description: External record catalog (Discogs, MusicBrainz fallback)
  - name: stores
    description: Local store directory
paths:
  /health:
    get:
      tags: [system]
      operationId: getHealth
      summary: Health check
      security: []
      responses:
        '200':
          description: The API is running
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    const: ok
        '500':
          $ref: '#/components/responses/InternalError'
  /catalog/search:
    get:
      tags: [catalog]
      operationId: searchCatalog
      summary: Search the external record catalog
      description: |
        Searches vinyl releases on Discogs and falls back to MusicBrainz when Discogs is unavailable or
        rate-limited. Identical queries (case- and whitespace-insensitive) are cached
        for 24 hours.
      security: []
      parameters:
        - name: q
          in: query
          required: true
          description: Artist, album or track text.
          schema:
            type: string
            minLength: 2
            maxLength: 200
          example: kind of blue
      responses:
        '200':
          description: Up to 20 normalised results
          content:
            application/json:
              schema:
                type: object
                required: [results]
                properties:
                  results:
                    type: array
                    maxItems: 20
                    items:
                      $ref: '#/components/schemas/CatalogResult'
        '400':
          $ref: '#/components/responses/ValidationError'
        '503':
          $ref: '#/components/responses/CatalogUnavailable'
  /catalog/records:
    post:
      tags: [catalog]
      operationId: upsertCatalogRecord
      summary: Save a catalog result as a master record
      description: |
        Looks up the release by `apiSourceId` on the server and upserts one
        `master_records` row keyed by `api_source_id`. Calling it again returns
        the same `recordId`. Requires a logged-in user.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [apiSourceId]
              properties:
                apiSourceId:
                  $ref: '#/components/schemas/ApiSourceId'
      responses:
        '200':
          description: The stored master record
          content:
            application/json:
              schema:
                allOf:
                  - type: object
                    required: [recordId]
                    properties:
                      recordId:
                        type: string
                        format: uuid
                  - $ref: '#/components/schemas/CatalogResult'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          description: The catalog, the database or authentication is unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                catalog:
                  value:
                    error:
                      code: CATALOG_UNAVAILABLE
                      message: The record catalog is unavailable, try again later
                database:
                  value:
                    error:
                      code: DATABASE_UNAVAILABLE
                      message: The database is not configured
                auth:
                  value:
                    error:
                      code: AUTH_UNAVAILABLE
                      message: Authentication is not configured
  /stores:
    get:
      tags: [stores]
      operationId: listStores
      summary: Stores near a location, nearest first
      description: |
        Pass `lat` and `lng` (GPS), or `zip` when GPS is off; `lat`/`lng` win when
        both are sent. A ZIP resolves to its 2024 Census ZCTA centroid. Rejected
        stores are never listed; pending stores are listed with `isVerified: false`.
      security: []
      parameters:
        - name: lat
          in: query
          schema: { type: number, minimum: -90, maximum: 90 }
          example: 45.5206
        - name: lng
          in: query
          schema: { type: number, minimum: -180, maximum: 180 }
          example: -122.7102
        - name: zip
          in: query
          schema: { type: string, pattern: '^[0-9]{5}$' }
          example: '97205'
        - name: radius
          in: query
          description: Search radius in `unit`.
          schema: { type: integer, enum: [5, 10, 25], default: 10 }
        - name: unit
          in: query
          schema: { type: string, enum: [mi, km], default: mi }
      responses:
        '200':
          description: Stores within the radius, sorted by distance
          content:
            application/json:
              schema:
                type: object
                required: [origin, unit, radius, stores]
                properties:
                  origin:
                    type: object
                    required: [lat, lng, source]
                    properties:
                      lat: { type: number }
                      lng: { type: number }
                      source: { type: string, enum: [coordinates, zip] }
                  unit: { type: string, enum: [mi, km] }
                  radius: { type: integer, enum: [5, 10, 25] }
                  stores:
                    type: array
                    items:
                      allOf:
                        - $ref: '#/components/schemas/StoreSummary'
                        - type: object
                          required: [distance]
                          properties:
                            distance:
                              type: number
                              description: Great-circle distance in `unit`, one decimal.
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          description: The ZIP has no Census centroid (e.g. PO-box-only ZIPs)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: ZIP_NOT_FOUND
                  message: No location for ZIP 82715
        '503':
          $ref: '#/components/responses/DatabaseUnavailable'
  /stores/{id}:
    get:
      tags: [stores]
      operationId: getStore
      summary: Store profile with active sightings and recent broadcasts
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreDetail'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/DatabaseUnavailable'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Supabase Auth access token. Write endpoints return `401 UNAUTHENTICATED`
        without one; merchant endpoints return `403 FORBIDDEN` unless the caller
        manages a verified store.
  schemas:
    ApiSourceId:
      type: string
      description: '`discogs:<release id>` or `musicbrainz:<release MBID>`.'
      pattern: '^(discogs:[1-9]\d*|musicbrainz:[0-9a-f-]{36})$'
      example: discogs:249504
    CatalogResult:
      type: object
      required:
        - apiSourceId
        - artistName
        - albumTitle
        - songTitle
        - recordLabel
        - releaseYear
        - genre
        - coverArtUrl
      properties:
        apiSourceId:
          $ref: '#/components/schemas/ApiSourceId'
        artistName:
          type: string
        albumTitle:
          type: string
        songTitle:
          type: [string, 'null']
        recordLabel:
          type: [string, 'null']
        releaseYear:
          type: [integer, 'null']
          minimum: 1900
          maximum: 2100
        genre:
          type: [string, 'null']
        coverArtUrl:
          type: [string, 'null']
          format: uri
          description: When null, the client shows a two-letter initials badge.
    StoreSummary:
      type: object
      required: [storeId, businessName, streetAddress, city, state, zip, geoLat, geoLng, tags, isVerified]
      properties:
        storeId: { type: string, format: uuid }
        businessName: { type: string }
        streetAddress: { type: string }
        city: { type: string }
        state: { type: string, pattern: '^[A-Z]{2}$' }
        zip: { type: string, pattern: '^[0-9]{5}$' }
        geoLat: { type: number }
        geoLng: { type: number }
        tags:
          type: array
          items: { type: string }
        isVerified: { type: boolean }
    DayHours:
      type: [object, 'null']
      description: Null means closed. A `close` at or before `open` runs past midnight.
      required: [open, close]
      properties:
        open: { type: string, pattern: '^[0-2][0-9]:[0-5][0-9]$', example: '11:00' }
        close: { type: string, pattern: '^[0-2][0-9]:[0-5][0-9]$', example: '19:00' }
    StoreDetail:
      allOf:
        - $ref: '#/components/schemas/StoreSummary'
        - type: object
          required:
            - phone
            - websiteUrl
            - operatingHours
            - timeZone
            - isOpenNow
            - paymentMethods
            - activeSightings
            - recentBroadcasts
          properties:
            phone: { type: [string, 'null'], example: '(503) 555-0142' }
            websiteUrl: { type: [string, 'null'], format: uri }
            operatingHours:
              type: object
              properties:
                mon: { $ref: '#/components/schemas/DayHours' }
                tue: { $ref: '#/components/schemas/DayHours' }
                wed: { $ref: '#/components/schemas/DayHours' }
                thu: { $ref: '#/components/schemas/DayHours' }
                fri: { $ref: '#/components/schemas/DayHours' }
                sat: { $ref: '#/components/schemas/DayHours' }
                sun: { $ref: '#/components/schemas/DayHours' }
            timeZone:
              type: string
              description: IANA zone used for `isOpenNow` (the main zone of the store's state).
              example: America/Los_Angeles
            isOpenNow: { type: boolean }
            paymentMethods:
              type: array
              items: { type: string }
            activeSightings:
              type: array
              maxItems: 50
              description: Active, unexpired sightings, newest first.
              items: { $ref: '#/components/schemas/StoreSighting' }
            recentBroadcasts:
              type: array
              maxItems: 10
              description: Newest first.
              items: { $ref: '#/components/schemas/StoreBroadcast' }
    StoreSighting:
      type: object
      required:
        - sightingId
        - recordId
        - artistName
        - albumTitle
        - genre
        - coverArtUrl
        - priceUsd
        - conditionGrade
        - specialAttributes
        - storeVerified
        - sightingTimestamp
      properties:
        sightingId: { type: string, format: uuid }
        recordId: { type: string, format: uuid }
        artistName: { type: string }
        albumTitle: { type: string }
        genre: { type: [string, 'null'] }
        coverArtUrl: { type: [string, 'null'], format: uri }
        priceUsd: { type: number, minimum: 0, example: 28 }
        conditionGrade: { type: string, enum: [mint, near_mint, vg_plus, vg, fair] }
        specialAttributes: { type: [string, 'null'] }
        storeVerified: { type: boolean }
        sightingTimestamp: { type: string, format: date-time }
    StoreBroadcast:
      type: object
      required: [broadcastId, arrivalSummary, photoUrl, featuredIds, postedAt]
      properties:
        broadcastId: { type: string, format: uuid }
        arrivalSummary: { type: string }
        photoUrl: { type: [string, 'null'], format: uri }
        featuredIds:
          type: array
          items: { type: string, format: uuid }
        postedAt: { type: string, format: date-time }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              pattern: '^[A-Z0-9_]+$'
            message:
              type: string
            details:
              type: object
              additionalProperties: true
  responses:
    Unauthenticated:
      description: Missing, invalid or expired access token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: UNAUTHENTICATED
              message: Log in to do this
    ValidationError:
      description: The request is invalid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: VALIDATION_ERROR
              message: Request is invalid
              details:
                issues:
                  - path: q
                    message: Too small
    NotFound:
      description: The resource does not exist
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: NOT_FOUND
              message: No catalog record discogs:1
    CatalogUnavailable:
      description: Every catalog provider failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: CATALOG_UNAVAILABLE
              message: The record catalog is unavailable, try again later
    DatabaseUnavailable:
      description: The database is not configured
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: DATABASE_UNAVAILABLE
              message: The database is not configured
    InternalError:
      description: Unexpected server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: INTERNAL_ERROR
              message: Something went wrong
