openapi: 3.1.0
info:
  title: CrateDig API
  version: 1.0.0
  description: |
    REST API for CrateDig, a local vinyl discovery and collection tool.
    Every error response uses the `Error` schema.
  license:
    name: UNLICENSED
    identifier: UNLICENSED
servers:
  - url: http://localhost:3000/api/v1
    description: Local development
tags:
  - name: system
    description: Service status
  - name: catalog
    description: External record catalog (Discogs, MusicBrainz fallback)
  - name: stores
    description: Local store directory
  - name: crate
    description: My Crate (Collection and Want List)
  - name: sightings
    description: Community sightings of records at stores
    description: Personal Collection and Want List
paths:
  /health:
    get:
      tags: [system]
      operationId: getHealth
      summary: Health check
      security: []
      responses:
        '200':
          description: The API is running
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    const: ok
        '500':
          $ref: '#/components/responses/InternalError'
  /catalog/search:
    get:
      tags: [catalog]
      operationId: searchCatalog
      summary: Search the external record catalog
      description: |
        Searches vinyl releases on Discogs and falls back to MusicBrainz when Discogs is unavailable or
        rate-limited. Identical queries (case- and whitespace-insensitive) are cached
        for 24 hours.
      security: []
      parameters:
        - name: q
          in: query
          required: true
          description: Artist, album or track text.
          schema:
            type: string
            minLength: 2
            maxLength: 200
          example: kind of blue
      responses:
        '200':
          description: Up to 20 normalised results
          content:
            application/json:
              schema:
                type: object
                required: [results]
                properties:
                  results:
                    type: array
                    maxItems: 20
                    items:
                      $ref: '#/components/schemas/CatalogResult'
        '400':
          $ref: '#/components/responses/ValidationError'
        '503':
          $ref: '#/components/responses/CatalogUnavailable'
  /catalog/records:
    post:
      tags: [catalog]
      operationId: upsertCatalogRecord
      summary: Save a catalog result as a master record
      description: |
        Looks up the release by `apiSourceId` on the server and upserts one
        `master_records` row keyed by `api_source_id`. Calling it again returns
        the same `recordId`. Requires a logged-in user.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [apiSourceId]
              properties:
                apiSourceId:
                  $ref: '#/components/schemas/ApiSourceId'
      responses:
        '200':
          description: The stored master record
          content:
            application/json:
              schema:
                allOf:
                  - type: object
                    required: [recordId]
                    properties:
                      recordId:
                        type: string
                        format: uuid
                  - $ref: '#/components/schemas/CatalogResult'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          description: The catalog, the database or authentication is unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                catalog:
                  value:
                    error:
                      code: CATALOG_UNAVAILABLE
                      message: The record catalog is unavailable, try again later
                database:
                  value:
                    error:
                      code: DATABASE_UNAVAILABLE
                      message: The database is not configured
                auth:
                  value:
                    error:
                      code: AUTH_UNAVAILABLE
                      message: Authentication is not configured
  /stores:
    get:
      tags: [stores]
      operationId: listStores
      summary: Stores near a location, nearest first
      description: |
        Pass `lat` and `lng` (GPS), or `zip` when GPS is off; `lat`/`lng` win when
        both are sent. A ZIP resolves to its 2024 Census ZCTA centroid. Rejected
        stores are never listed; pending stores are listed with `isVerified: false`.
      security: []
      parameters:
        - name: lat
          in: query
          schema: { type: number, minimum: -90, maximum: 90 }
          example: 45.5206
        - name: lng
          in: query
          schema: { type: number, minimum: -180, maximum: 180 }
          example: -122.7102
        - name: zip
          in: query
          schema: { type: string, pattern: '^[0-9]{5}$' }
          example: '97205'
        - name: radius
          in: query
          description: Search radius in `unit`.
          schema: { type: integer, enum: [5, 10, 25], default: 10 }
        - name: unit
          in: query
          schema: { type: string, enum: [mi, km], default: mi }
      responses:
        '200':
          description: Stores within the radius, sorted by distance
          content:
            application/json:
              schema:
                type: object
                required: [origin, unit, radius, stores]
                properties:
                  origin:
                    type: object
                    required: [lat, lng, source]
                    properties:
                      lat: { type: number }
                      lng: { type: number }
                      source: { type: string, enum: [coordinates, zip] }
                  unit: { type: string, enum: [mi, km] }
                  radius: { type: integer, enum: [5, 10, 25] }
                  stores:
                    type: array
                    items:
                      allOf:
                        - $ref: '#/components/schemas/StoreSummary'
                        - type: object
                          required: [distance]
                          properties:
                            distance:
                              type: number
                              description: Great-circle distance in `unit`, one decimal.
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          description: The ZIP has no Census centroid (e.g. PO-box-only ZIPs)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: ZIP_NOT_FOUND
                  message: No location for ZIP 82715
        '503':
          $ref: '#/components/responses/DatabaseUnavailable'
  /stores/{id}:
    get:
      tags: [stores]
      operationId: getStore
      summary: Store profile with active sightings and recent broadcasts
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreDetail'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/DatabaseUnavailable'
  /records/{id}:
    get:
      tags: [catalog]
      operationId: getRecord
      summary: Album details with active sightings, nearest first when a location is given
      security: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: lat, in: query, schema: { type: number } }
        - { name: lng, in: query, schema: { type: number } }
        - { name: zip, in: query, schema: { type: string, pattern: '^\\d{5}$' } }
        - { name: unit, in: query, schema: { type: string, enum: [mi, km], default: mi } }
      responses:
        '200':
          description: The record
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/RecordSummary'
                  - type: object
                    properties:
                      unit: { type: string, enum: [mi, km] }
                      activeSightings:
                        type: array
                        items:
                          type: object
                          properties:
                            sightingId: { type: string, format: uuid }
                            priceUsd: { type: number }
                            conditionGrade: { $ref: '#/components/schemas/ConditionGrade' }
                            storeVerified: { type: boolean }
                            sightingTimestamp: { type: string, format: date-time }
                            distance: { type: [number, 'null'] }
                            store:
                              type: object
                              properties:
                                storeId: { type: string, format: uuid }
                                businessName: { type: string }
        '404':
          $ref: '#/components/responses/NotFound'
  /crate:
    get:
      tags: [crate]
      operationId: listCrate
      summary: The caller's Collection or Want List
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: listType, in: query, schema: { $ref: '#/components/schemas/ListType' } }
        - { name: q, in: query, description: 'Matches title, artist or genre', schema: { type: string } }
        - { name: genre, in: query, schema: { type: string } }
        - { name: recordId, in: query, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Items, newest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/CrateItem' } }
        '401':
          $ref: '#/components/responses/Unauthenticated'
    post:
      tags: [crate]
      operationId: addCrateItem
      summary: Add a record to the Collection or Want List
      security: [{ bearerAuth: [] }]
      parameters:
        - name: Idempotency-Key
          in: header
          description: Client UUID; a replay returns the item already created (200)
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [listType]
              description: Exactly one of apiSourceId or recordId.
              properties:
                apiSourceId: { $ref: '#/components/schemas/ApiSourceId' }
                recordId: { type: string, format: uuid }
                listType: { $ref: '#/components/schemas/ListType' }
                conditionGrade: { $ref: '#/components/schemas/ConditionGrade' }
                specialAttributes: { type: array, maxItems: 10, items: { type: string, maxLength: 40 } }
                purchasePriceUsd: { type: number, minimum: 0, multipleOf: 0.01 }
                userNotes: { type: string, maxLength: 1000 }
                force: { type: boolean, description: Add a second Collection copy anyway }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CrateItem' }
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '409':
          $ref: '#/components/responses/Conflict'
  /crate/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [crate]
      operationId: getCrateItem
      summary: One of the caller's items
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: The item
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CrateItem' }
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [crate]
      operationId: updateCrateItem
      summary: Edit condition, attributes, price or notes
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                conditionGrade: { oneOf: [{ $ref: '#/components/schemas/ConditionGrade' }, { type: 'null' }] }
                specialAttributes: { type: array, maxItems: 10, items: { type: string } }
                purchasePriceUsd: { type: [number, 'null'], minimum: 0 }
                userNotes: { type: [string, 'null'], maxLength: 1000 }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CrateItem' }
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [crate]
      operationId: deleteCrateItem
      summary: Remove an item
      security: [{ bearerAuth: [] }]
      responses:
        '204':
          description: Deleted
        '404':
          $ref: '#/components/responses/NotFound'
  /crate/{id}/acquire:
    post:
      tags: [crate]
      operationId: acquireCrateItem
      summary: Move a Want List item to the Collection and close that store's sightings
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [storeId]
              properties:
                storeId: { type: [string, 'null'], format: uuid, description: null means acquired elsewhere }
                purchasePriceUsd: { type: number, minimum: 0 }
      responses:
        '200':
          description: Acquired
          content:
            application/json:
              schema:
                type: object
                properties:
                  item: { $ref: '#/components/schemas/CrateItem' }
                  closedSightingIds: { type: array, items: { type: string, format: uuid } }
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
  /sightings:
    post:
      tags: [sightings]
      operationId: reportSighting
      summary: Report a record seen at a store
      description: |
        The server sets `status: active`, `storeVerified: false`, the reporter and
        `archiveDate` (+180 days); those fields are ignored if sent. Each user can
        report 20 sightings per rolling 24 hours. Repeat an `Idempotency-Key` to
        replay a queued offline report without creating a duplicate.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: Idempotency-Key, in: header, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [storeId, conditionGrade]
              description: Send exactly one of apiSourceId or recordId.
              properties:
                apiSourceId: { $ref: '#/components/schemas/ApiSourceId' }
                recordId: { type: string, format: uuid }
                storeId: { type: string, format: uuid }
                conditionGrade: { $ref: '#/components/schemas/ConditionGrade' }
                priceUsd: { type: [number, 'null'], minimum: 0, multipleOf: 0.01 }
                specialAttributes: { type: array, maxItems: 10, items: { type: string, maxLength: 40 } }
      responses:
        '200':
          description: Replayed an earlier report with the same Idempotency-Key
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Sighting' }
        '201':
          description: Reported
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Sighting' }
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          description: Daily report limit reached
          headers:
            Retry-After: { schema: { type: integer } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /sightings/{id}:
    get:
      tags: [sightings]
      operationId: getSighting
      summary: One sighting with its record, store and reporter
      security: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: lat, in: query, schema: { type: number } }
        - { name: lng, in: query, schema: { type: number } }
        - { name: zip, in: query, schema: { type: string, pattern: '^\\d{5}$' } }
        - { name: unit, in: query, schema: { type: string, enum: [mi, km], default: mi } }
      responses:
        '200':
          description: The sighting
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Sighting'
                  - type: object
                    properties:
                      distance: { type: [number, 'null'] }
                      unit: { type: string, enum: [mi, km] }
        '404':
          $ref: '#/components/responses/NotFound'
  /stores/nearest:
    get:
      tags: [stores]
      operationId: nearestStore
      summary: Closest verified store to a GPS fix (pre-selects the report form)
      security: []
      parameters:
        - { name: lat, in: query, required: true, schema: { type: number } }
        - { name: lng, in: query, required: true, schema: { type: number } }
        - { name: verifiedOnly, in: query, schema: { type: boolean, default: true } }
      responses:
        '200':
          description: Nearest store, distance in miles
          content:
            application/json:
              schema:
                type: object
                properties:
                  store:
                    allOf:
                      - $ref: '#/components/schemas/StoreSummary'
                      - type: object
                        properties:
                          distance: { type: number }
                  unit: { type: string, enum: [mi] }
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Supabase Auth access token. Write endpoints return `401 UNAUTHENTICATED`
        without one; merchant endpoints return `403 FORBIDDEN` unless the caller
        manages a verified store.
  schemas:
    ApiSourceId:
      type: string
      description: '`discogs:<release id>` or `musicbrainz:<release MBID>`.'
      pattern: '^(discogs:[1-9]\d*|musicbrainz:[0-9a-f-]{36})$'
      example: discogs:249504
    CatalogResult:
      type: object
      required:
        - apiSourceId
        - artistName
        - albumTitle
        - songTitle
        - recordLabel
        - releaseYear
        - genre
        - coverArtUrl
      properties:
        apiSourceId:
          $ref: '#/components/schemas/ApiSourceId'
        artistName:
          type: string
        albumTitle:
          type: string
        songTitle:
          type: [string, 'null']
        recordLabel:
          type: [string, 'null']
        releaseYear:
          type: [integer, 'null']
          minimum: 1900
          maximum: 2100
        genre:
          type: [string, 'null']
        coverArtUrl:
          type: [string, 'null']
          format: uri
          description: When null, the client shows a two-letter initials badge.
    StoreSummary:
      type: object
      required: [storeId, businessName, streetAddress, city, state, zip, geoLat, geoLng, tags, isVerified]
      properties:
        storeId: { type: string, format: uuid }
        businessName: { type: string }
        streetAddress: { type: string }
        city: { type: string }
        state: { type: string, pattern: '^[A-Z]{2}$' }
        zip: { type: string, pattern: '^[0-9]{5}$' }
        geoLat: { type: number }
        geoLng: { type: number }
        tags:
          type: array
          items: { type: string }
        isVerified: { type: boolean }
    DayHours:
      type: [object, 'null']
      description: Null means closed. A `close` at or before `open` runs past midnight.
      required: [open, close]
      properties:
        open: { type: string, pattern: '^[0-2][0-9]:[0-5][0-9]$', example: '11:00' }
        close: { type: string, pattern: '^[0-2][0-9]:[0-5][0-9]$', example: '19:00' }
    StoreDetail:
      allOf:
        - $ref: '#/components/schemas/StoreSummary'
        - type: object
          required:
            - phone
            - websiteUrl
            - operatingHours
            - timeZone
            - isOpenNow
            - paymentMethods
            - activeSightings
            - recentBroadcasts
          properties:
            phone: { type: [string, 'null'], example: '(503) 555-0142' }
            websiteUrl: { type: [string, 'null'], format: uri }
            operatingHours:
              type: object
              properties:
                mon: { $ref: '#/components/schemas/DayHours' }
                tue: { $ref: '#/components/schemas/DayHours' }
                wed: { $ref: '#/components/schemas/DayHours' }
                thu: { $ref: '#/components/schemas/DayHours' }
                fri: { $ref: '#/components/schemas/DayHours' }
                sat: { $ref: '#/components/schemas/DayHours' }
                sun: { $ref: '#/components/schemas/DayHours' }
            timeZone:
              type: string
              description: IANA zone used for `isOpenNow` (the main zone of the store's state).
              example: America/Los_Angeles
            isOpenNow: { type: boolean }
            paymentMethods:
              type: array
              items: { type: string }
            activeSightings:
              type: array
              maxItems: 50
              description: Active, unexpired sightings, newest first.
              items: { $ref: '#/components/schemas/StoreSighting' }
            recentBroadcasts:
              type: array
              maxItems: 10
              description: Newest first.
              items: { $ref: '#/components/schemas/StoreBroadcast' }
    StoreSighting:
      type: object
      required:
        - sightingId
        - recordId
        - artistName
        - albumTitle
        - genre
        - coverArtUrl
        - priceUsd
        - conditionGrade
        - specialAttributes
        - storeVerified
        - sightingTimestamp
      properties:
        sightingId: { type: string, format: uuid }
        recordId: { type: string, format: uuid }
        artistName: { type: string }
        albumTitle: { type: string }
        genre: { type: [string, 'null'] }
        coverArtUrl: { type: [string, 'null'], format: uri }
        priceUsd: { type: number, minimum: 0, example: 28 }
        conditionGrade: { type: string, enum: [mint, near_mint, vg_plus, vg, fair] }
        specialAttributes: { type: [string, 'null'] }
        storeVerified: { type: boolean }
        sightingTimestamp: { type: string, format: date-time }
    StoreBroadcast:
      type: object
      required: [broadcastId, arrivalSummary, photoUrl, featuredIds, postedAt]
      properties:
        broadcastId: { type: string, format: uuid }
        arrivalSummary: { type: string }
        photoUrl: { type: [string, 'null'], format: uri }
        featuredIds:
          type: array
          items: { type: string, format: uuid }
        postedAt: { type: string, format: date-time }
    ListType:
      type: string
      enum: [collection, want_list]
    ConditionGrade:
      type: string
      enum: [mint, near_mint, vg_plus, vg, fair]
    RecordSummary:
      type: object
      properties:
        recordId: { type: string, format: uuid }
        apiSourceId: { type: string }
        artistName: { type: string }
        albumTitle: { type: string }
        songTitle: { type: [string, 'null'] }
        recordLabel: { type: [string, 'null'] }
        releaseYear: { type: [integer, 'null'] }
        genre: { type: [string, 'null'] }
        coverArtUrl: { type: [string, 'null'], format: uri }
    Sighting:
      type: object
      properties:
        sightingId: { type: string, format: uuid }
        priceUsd: { type: number, minimum: 0 }
        conditionGrade: { $ref: '#/components/schemas/ConditionGrade' }
        specialAttributes: { type: [string, 'null'] }
        storeVerified: { type: boolean }
        status: { type: string, enum: [active, sold_out, flagged, archived] }
        sightingTimestamp: { type: string, format: date-time }
        archiveDate: { type: string, format: date-time }
        reporter:
          type: [object, 'null']
          properties:
            userId: { type: string, format: uuid }
            displayName: { type: string }
        record: { $ref: '#/components/schemas/RecordSummary' }
        store:
          allOf:
            - $ref: '#/components/schemas/StoreSummary'
    CrateItem:
      type: object
      properties:
        crateItemId: { type: string, format: uuid }
        listType: { $ref: '#/components/schemas/ListType' }
        conditionGrade: { oneOf: [{ $ref: '#/components/schemas/ConditionGrade' }, { type: 'null' }] }
        specialAttributes: { type: array, items: { type: string } }
        purchasePriceUsd: { type: [number, 'null'] }
        userNotes: { type: [string, 'null'] }
        acquiredAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
        purchasedStore:
          type: [object, 'null']
          properties:
            storeId: { type: string, format: uuid }
            businessName: { type: string }
        record: { $ref: '#/components/schemas/RecordSummary' }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              pattern: '^[A-Z0-9_]+$'
            message:
              type: string
            details:
              type: object
              additionalProperties: true
  responses:
    Conflict:
      description: Conflicts with the current state (e.g. ALREADY_OWNED, NOT_ON_WANT_LIST)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthenticated:
      description: Missing, invalid or expired access token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: UNAUTHENTICATED
              message: Log in to do this
    ValidationError:
      description: The request is invalid
      content:
