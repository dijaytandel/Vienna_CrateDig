# Amplify Hosting reads custom headers from this file (monorepo format).
applications:
  - appRoot: client
    customHeaders:
      - pattern: '{index.html,sw.js,registerSW.js,push-sw.js,manifest.webmanifest}'
        headers:
          - key: Cache-Control
            value: no-cache
      - pattern: 'assets/**'
        headers:
          - key: Cache-Control
            value: public, max-age=31536000, immutable
